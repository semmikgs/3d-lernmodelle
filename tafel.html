<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>3D-Lernmodelle – Tafelansicht</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif;
               background: radial-gradient(circle at 50% 40%, #f4f5f7 0%, #c9ced6 70%, #9aa1ab 100%); }
  [hidden] { display: none !important; }
  canvas { display: block; touch-action: none; }
  #leiste { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; overflow-x: auto;
            padding: 8px 12px; background: rgba(20,24,30,.85); color: #fff; font-size: 18px; scrollbar-width: thin; }
  #leiste > * { flex: none; }
  #modell { max-width: 300px; } #teil { max-width: 240px; }
  /* aufklappbare Felder über der Leiste: verdecken das Modell nur, solange sie offen sind */
  .feld { position: fixed; bottom: calc(var(--leiste, 64px) + 8px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
          max-width: min(1100px, 94vw); padding: 10px 12px; background: rgba(20,24,30,.9); color: #fff; border-radius: 14px;
          box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 18px; z-index: 5; }
  .feld select, .feld button, .feld input { font-size: 18px; padding: 10px 14px; border-radius: 10px; border: 0; min-height: 48px; }
  .feld button.on { background: #3b82f6; color: #fff; }
  #genFeld { left: 12px; } #ansichtFeld { left: 50%; transform: translateX(-50%); }
  #schiebeFeld { right: 12px; background: transparent; box-shadow: none; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; padding: 10px; }
  #schiebeFeld button { min-height: 0; width: 100%; height: 100%; padding: 0; font-size: 24px; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #schiebeFeld #frontal { background: #3b82f6; color: #fff; font-size: 26px; }
  #leiste button.auf { outline: 3px solid #93c5fd; }
  #leiste select, #leiste button { font-size: 18px; padding: 10px 14px; border-radius: 10px; border: 0; min-height: 48px; }
  #leiste button.on { background: #3b82f6; color: #fff; }
  .gruppe { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .trenner { width: 1px; align-self: stretch; background: rgba(255,255,255,.25); }
  #titel { position: fixed; top: 14px; left: 16px; font-size: 22px; font-weight: 600; color: #1f2937; }
  #gen { display: contents; }
  #gen button, #gen select { white-space: nowrap; }
  #info { position: fixed; top: 12px; right: 12px; width: min(520px, 42vw); max-height: 60vh; overflow: auto; background: rgba(255,255,255,.93);
          color: #111; padding: 12px 16px; border-radius: 12px; font-size: 18px; line-height: 1.45; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
  #info i { color: #374151; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="titel">Markerwürfel</div>
<div id="info" hidden></div>
<div id="leiste">
  <div class="gruppe">
    <button id="zeigWuerfel" class="on">Würfel</button>
    <button id="zeigModell">Modell</button>
  </div>
  <div class="gruppe" id="modellWahl" hidden>
    <select id="modell"></select>
    <select id="teil" hidden></select>
    <button id="genBtn" hidden title="Einstellungen des Modells">⚙ Einstellungen</button>
    <button id="infoBtn" hidden>Info</button>
    <button id="dach" hidden>Dach</button>
    <button id="abspielen" hidden>⏸ Pause</button>
    <input id="zeit" type="range" min="0" max="1" step="0.001" value="0" hidden style="width:220px">
  </div>
  <div class="trenner"></div>
  <button id="ansichtBtn" title="Blickrichtung wählen">👁 Ansicht</button>
  <div class="trenner"></div>
  <div class="gruppe">
    <button id="kleiner" title="Verkleinern">−</button><button id="groesser" title="Vergrößern">+</button>
  </div>
  <div class="trenner"></div>
</div>
<div class="feld" id="genFeld" hidden><span id="gen"></span></div>
<div class="feld" id="ansichtFeld" hidden>
  <div class="gruppe" id="ansichten">
    <button data-v="schraeg">Schräg</button><button data-v="vorne">Vorne</button><button data-v="hinten">Hinten</button>
    <button data-v="links">Links</button><button data-v="rechts">Rechts</button><button data-v="oben">Oben</button><button data-v="unten">Unten</button>
  </div>
</div>
<div class="feld" id="schiebeFeld" title="Modell verschieben (auch Pfeiltasten oder mit zwei Fingern ziehen)">
  <span></span><button data-p="0,1">▲</button><span></span>
  <button data-p="-1,0">◀</button><button id="frontal" title="Zurück zur Frontalansicht (Mitte, Vorderansicht, normale Größe)">⟲</button><button data-p="1,0">▶</button>
  <span></span><button data-p="0,-1">▼</button><span></span>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { MODELLE } from './modelle/liste.js';
import { Animation } from './js/animation.js';
import { GENERATOREN } from './js/generatoren/index.js';

const E = 1.25;   // Würfelkante in Marker-Einheiten (wie im Viewer)
// Faltvorlage: Seite → [rechts, oben (Bildrichtung), Normale] im Würfelsystem
const SEITEN = {
  1: { name: 'oben',   a: [[1,0,0],[0,0,-1],[0,1,0]] },
  2: { name: 'vorne',  a: [[1,0,0],[0,1,0],[0,0,1]] },
  3: { name: 'unten',  a: [[1,0,0],[0,0,1],[0,-1,0]] },
  4: { name: 'links',  a: [[0,0,1],[0,1,0],[-1,0,0]] },
  5: { name: 'rechts', a: [[0,0,-1],[0,1,0],[1,0,0]] },
  6: { name: 'hinten', a: [[-1,0,0],[0,1,0],[0,0,-1]] },
};

// ---- Szene ----
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
let abstand = 4.8;
const NAH = 0.25, FERN = 15;          // Zoomgrenzen (NAH ≈ 10-mal näher als früher)
// Blickpunkt im Würfelsystem: dieser Punkt liegt immer in der Bildmitte, um ihn wird gedreht und gezoomt
const fokus = new THREE.Vector3();
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
const sonne = new THREE.DirectionalLight(0xffffff, 1.4); sonne.position.set(2, 4, 3); scene.add(sonne);

function groesse() {
  const lh = document.getElementById('leiste').offsetHeight, h = innerHeight - lh;
  document.documentElement.style.setProperty('--leiste', lh + 'px');
  renderer.setSize(innerWidth, h);
  camera.aspect = innerWidth / h; camera.updateProjectionMatrix();
}
addEventListener('resize', groesse);

// Würfel-Gruppe: wird gedreht; enthält Bastelwürfel, Umriss und Modell
const wuerfel = new THREE.Group(); scene.add(wuerfel);
const bastel = new THREE.Group(); wuerfel.add(bastel);
const umriss = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(E, E, E)), new THREE.LineBasicMaterial({ color: 0x475569, transparent: true, opacity: 0.6 }));
umriss.visible = false; wuerfel.add(umriss);

function seitenTextur(id) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const img = new Image();
  img.onload = () => {
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 51, 51, 410, 410);                       // Marker = 80 % der Seite (wie Vorlage)
    g.fillStyle = '#6b7280'; g.font = '22px system-ui'; g.fillText(id + ' ' + SEITEN[id].name, 8, 502);
    t.needsUpdate = true;
  };
  img.src = 'marker/bilder/' + id + '.png';
  return t;
}
for (const id in SEITEN) {
  const [rt, up, n] = SEITEN[id].a.map(v => new THREE.Vector3(...v));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(E, E), new THREE.MeshBasicMaterial({ map: seitenTextur(id) }));
  const M = new THREE.Matrix4().makeBasis(rt, up, n); M.setPosition(n.clone().multiplyScalar(E / 2));
  m.applyMatrix4(M); bastel.add(m);
}
// Papierkanten
bastel.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(E, E, E)), new THREE.LineBasicMaterial({ color: 0x9ca3af })));

// ---- Modell ----
const hülle = new THREE.Group(); hülle.visible = false; wuerfel.add(hülle);
const anim = new Animation(document.getElementById('abspielen'), document.getElementById('zeit'));
const loader = new GLTFLoader();
const sel = document.getElementById('modell'), selTeil = document.getElementById('teil'), btnDach = document.getElementById('dach');
for (const [k, v] of Object.entries(MODELLE)) sel.add(new Option(v.name, k));
let inhalt = null, cfg = null, knoten = {}, boxen = {}, gesamtBox = null, dachAn = false, nr = 0;

// Abnehmbares Teil (Dach, Vorderseite …) – aus der Modellliste, Standard: Dach
const abd = () => (cfg && cfg.abdeckung && cfg.abdeckung.id) || 'dach';
// Generator-Modelle (z. B. Atom): im Browser erzeugt
// Aufklappfelder: Einstellungen, Ansicht, Verschieben
const genBtn = document.getElementById('genBtn'), feldGen = document.getElementById('genFeld');
const felder = [[genBtn, feldGen], [document.getElementById('ansichtBtn'), document.getElementById('ansichtFeld')]];
function schliesse(f) { f.hidden = true; for (const [b, g] of felder) if (g === f) b.classList.remove('auf'); }
for (const [b, f] of felder) b.onclick = () => { const auf = f.hidden; f.hidden = !auf; b.classList.toggle('auf', auf); };
const genEl = document.getElementById('gen'), infoEl = document.getElementById('info'), btnInfo = document.getElementById('infoBtn');
let gen = null, ersteUrl = true, infoAn = false;
btnInfo.onclick = () => { infoAn = !infoAn; infoEl.hidden = !infoAn; btnInfo.classList.toggle('on', infoAn); };
async function ladeGenerator(name, meine) {
  const mod = await GENERATOREN[cfg.generator]();
  if (meine !== nr) return;
  const st = ersteUrl && Q.get('m') === name ? mod.ausUrl(Q) : mod.standard();
  gen = { mod, st, erg: null };
  const baue = () => {
    if (inhalt) { hülle.remove(inhalt); if (gen.erg) mod.entsorge(gen.erg.objekt); }
    gen.erg = mod.erzeuge(st); inhalt = gen.erg.objekt;
    hülle.add(inhalt); hülle.scale.setScalar(E * 0.62 / gen.erg.radius);
    document.getElementById('titel').textContent = gen.erg.titel;
    infoEl.innerHTML = gen.erg.info; infoEl.hidden = !infoAn;
    gen.erg.beiInfo = h => { infoEl.innerHTML = h; }; btnInfo.hidden = false; btnInfo.classList.toggle('on', infoAn);
    history.replaceState(null, '', '?m=' + name + mod.zuUrl(st));
  };
  mod.bedienung(genEl, st, baue); genEl.hidden = false; genBtn.hidden = false;
  anim.setze(null, []); btnDach.hidden = true; fokus.set(0, 0, 0);
  baue();
}
function lade(name) {
  const meine = ++nr; cfg = MODELLE[name];
  if (gen) { if (inhalt) { hülle.remove(inhalt); gen.mod.entsorge(inhalt); inhalt = null; } gen = null; }
  genEl.innerHTML = ''; infoEl.hidden = true; btnInfo.hidden = true; genBtn.hidden = true; schliesse(feldGen);
  if (cfg.generator) { selTeil.hidden = true; ladeGenerator(name, meine).finally(() => ersteUrl = false); return; }
  ersteUrl = false; history.replaceState(null, '', '?m=' + name);
  btnDach.textContent = (cfg.abdeckung && cfg.abdeckung.name) || 'Dach';
  selTeil.innerHTML = ''; selTeil.hidden = !cfg.teile;
  if (cfg.teile) { if (cfg.ganz !== false) selTeil.add(new Option(cfg.ganz || 'Ganzes Modell', '')); for (const t of cfg.teile) selTeil.add(new Option(t.name, t.id)); }
  loader.load('modelle/' + name + '.glb', (gltf) => {
    if (meine !== nr) return;
    if (inhalt) hülle.remove(inhalt);
    inhalt = gltf.scene; inhalt.updateMatrixWorld(true);
    gesamtBox = new THREE.Box3().setFromObject(inhalt);
    knoten = {}; boxen = {};
    for (const id of [...(cfg.teile || []).flatMap(t => [t.id, t.detail]).filter(Boolean), abd(), 'umgebung']) {
      const k = inhalt.getObjectByName(id);
      if (k) { knoten[id] = k; boxen[id] = new THREE.Box3().setFromObject(k); }
    }
    dachAn = false; hülle.add(inhalt); anim.setze(inhalt, gltf.animations);
    zeige(cfg.ganz === false && cfg.teile ? (cfg.start || cfg.teile[0].id) : '');
  });
}
function zeige(teil) {
  if (!inhalt) return;
  if (gen) { document.getElementById('titel').textContent = modellModus ? gen.erg.titel : 'Markerwürfel'; infoEl.hidden = !(modellModus && infoAn); return; }
  const t = cfg.teile && cfg.teile.find(x => x.id === teil);
  const details = new Set((cfg.teile || []).map(x => x.detail).filter(Boolean));
  const ziel = t ? ((t.detail && knoten[t.detail]) ? t.detail : teil) : null;
  for (const [id, k] of Object.entries(knoten)) k.visible = t ? id === ziel : (id === abd() ? dachAn : !details.has(id));
  const box = t ? boxen[ziel] : gesamtBox;
  inhalt.position.copy(box.getCenter(new THREE.Vector3())).negate();
  hülle.scale.setScalar(E * (t ? 1.5 : 1.3) / box.getSize(new THREE.Vector3()).length());
  selTeil.value = t ? teil : ''; fokus.set(0, 0, 0);
  btnDach.hidden = !knoten[abd()] || !!t; btnDach.classList.toggle('on', dachAn);
  document.getElementById('titel').textContent = modellModus ? (t ? t.name : cfg.name) : 'Markerwürfel';
  anim.starte(t ? t.animation : cfg.animation);
}
sel.onchange = () => lade(sel.value);
selTeil.onchange = () => zeige(selTeil.value);
btnDach.onclick = () => { dachAn = !dachAn; if (knoten[abd()]) knoten[abd()].visible = dachAn; btnDach.classList.toggle('on', dachAn); };

// ---- Umschalten Würfel / Modell ----
let modellModus = false;
function modus(m) {
  modellModus = m;
  bastel.visible = !m; umriss.visible = m; hülle.visible = m;
  document.getElementById('zeigWuerfel').classList.toggle('on', !m);
  document.getElementById('zeigModell').classList.toggle('on', m);
  document.getElementById('modellWahl').hidden = !m;
  if (!m) { infoEl.hidden = true; schliesse(feldGen); }
  groesse();
  if (m && !inhalt) lade(sel.value); else zeige(selTeil.value);
}
document.getElementById('zeigWuerfel').onclick = () => modus(false);
document.getElementById('zeigModell').onclick = () => modus(true);

// ---- Schnellansichten (weich animiert) ----
const ANSICHTEN = {
  schraeg: new THREE.Euler(0.45, -0.6, 0),
  vorne: new THREE.Euler(0, 0, 0),
  hinten: new THREE.Euler(0, Math.PI, 0),
  links: new THREE.Euler(0, Math.PI / 2, 0),
  rechts: new THREE.Euler(0, -Math.PI / 2, 0),
  oben: new THREE.Euler(Math.PI / 2, 0, 0),
  unten: new THREE.Euler(-Math.PI / 2, 0, 0),
};
let ziel = null;
function ansicht(v) {
  ziel = new THREE.Quaternion().setFromEuler(ANSICHTEN[v]);
  document.querySelectorAll('#ansichten button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
document.querySelectorAll('#ansichten button').forEach(b => b.onclick = () => { ansicht(b.dataset.v); schliesse(document.getElementById('ansichtFeld')); });
wuerfel.quaternion.setFromEuler(ANSICHTEN.schraeg);
document.querySelector('[data-v="schraeg"]').classList.add('on');

// ---- Drehen mit Finger/Maus (wie einen echten Würfel), Zoom mit Pinch/Mausrad ----
const zeiger = new Map(); let pinchStart = 0, abstandStart = abstand, mitteAlt = null, schiebeMaus = false;
const zoome = f => abstand = THREE.MathUtils.clamp(abstand * f, NAH, FERN);
// Verschieben um Bildpunkte (dx nach rechts, dy nach unten) – Weltmaß passend zur Zoomstufe
function schiebe(dx, dy) {
  const proPixel = 2 * abstand * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / el.clientHeight;
  const d = new THREE.Vector3(dx * proPixel, -dy * proPixel, 0).applyQuaternion(wuerfel.quaternion.clone().invert());
  fokus.sub(d);
}
const el = renderer.domElement;
el.addEventListener('contextmenu', e => e.preventDefault());
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
  schiebeMaus = e.pointerType === 'mouse' && (e.button === 1 || e.button === 2 || e.shiftKey);
  if (!schiebeMaus) { ziel = null; document.querySelectorAll('#ansichten button').forEach(b => b.classList.remove('on')); }
  if (zeiger.size === 2) { const [a, b] = [...zeiger.values()]; pinchStart = Math.hypot(a.x - b.x, a.y - b.y); abstandStart = abstand;
    mitteAlt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; } });
el.addEventListener('pointermove', e => {
  const alt = zeiger.get(e.pointerId); if (!alt) return;
  const neu = { x: e.clientX, y: e.clientY }; zeiger.set(e.pointerId, neu);
  if (zeiger.size === 1 && schiebeMaus) {
    schiebe(neu.x - alt.x, neu.y - alt.y);
  } else if (zeiger.size === 1) {
    const k = 3.5 / Math.min(innerWidth, innerHeight);
    const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler((neu.y - alt.y) * k, (neu.x - alt.x) * k, 0, 'XYZ'));
    wuerfel.quaternion.premultiply(dq);
  } else if (zeiger.size === 2 && pinchStart) {
    const [a, b] = [...zeiger.values()];
    abstand = THREE.MathUtils.clamp(abstandStart * pinchStart / Math.hypot(a.x - b.x, a.y - b.y), NAH, FERN);
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (mitteAlt) schiebe(m.x - mitteAlt.x, m.y - mitteAlt.y);
    mitteAlt = m;
  }
});
const los = e => { zeiger.delete(e.pointerId); if (zeiger.size < 2) { pinchStart = 0; mitteAlt = null; } };
el.addEventListener('pointerup', los); el.addEventListener('pointercancel', los);
el.addEventListener('wheel', e => { e.preventDefault(); zoome(Math.exp(e.deltaY * 0.0015)); }, { passive: false });
// +/− und Pfeile: gedrückt halten = weiterlaufen
let zoomRichtung = 0; const schub = { x: 0, y: 0 };
function halten(knopf, an, aus) {
  knopf.addEventListener('pointerdown', e => { e.preventDefault(); an(); });
  for (const t of ['pointerup', 'pointerleave', 'pointercancel']) knopf.addEventListener(t, aus);
}
halten(document.getElementById('groesser'), () => { zoome(1 / 1.15); zoomRichtung = -1; }, () => zoomRichtung = 0);
halten(document.getElementById('kleiner'), () => { zoome(1.15); zoomRichtung = 1; }, () => zoomRichtung = 0);
document.querySelectorAll('#schiebeFeld [data-p]').forEach(b => {
  const [x, y] = b.dataset.p.split(',').map(Number);
  halten(b, () => { schub.x = x; schub.y = y; }, () => { schub.x = schub.y = 0; });
});
document.getElementById('frontal').onclick = () => { fokus.set(0, 0, 0); abstand = 4.8; ansicht('vorne'); };
const tasten = new Set();
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', '+', '-', '='].includes(e.key)) { e.preventDefault(); tasten.add(e.key); }
});
addEventListener('keyup', e => tasten.delete(e.key));
addEventListener('blur', () => tasten.clear());
function steuerung(dt) {
  let sx = schub.x, sy = schub.y, z = zoomRichtung;
  if (tasten.has('ArrowLeft')) sx -= 1; if (tasten.has('ArrowRight')) sx += 1;
  if (tasten.has('ArrowUp')) sy += 1; if (tasten.has('ArrowDown')) sy -= 1;
  if (tasten.has('+') || tasten.has('=')) z -= 1; if (tasten.has('-')) z += 1;
  // Pfeil = Modell wandert in diese Richtung, ca. 40 % der Bildhöhe pro Sekunde
  if (sx || sy) schiebe(sx * el.clientHeight * 0.4 * dt, -sy * el.clientHeight * 0.4 * dt);
  if (z) zoome(Math.exp(z * 1.2 * dt));
}

// ---- Start ----
const Q = new URLSearchParams(location.search);
if (Q.get('m') && MODELLE[Q.get('m')]) sel.value = Q.get('m');
groesse();
if (Q.get('m')) modus(true);
let letzteZeit = performance.now();
renderer.setAnimationLoop(() => {
  const jetzt = performance.now(); const dt = Math.min((jetzt - letzteZeit) / 1000, 0.1); anim.update(dt); letzteZeit = jetzt; steuerung(dt);
  if (gen && gen.erg) gen.erg.update(dt);
  if (ziel) { wuerfel.quaternion.slerp(ziel, 0.12); if (wuerfel.quaternion.angleTo(ziel) < 0.002) { wuerfel.quaternion.copy(ziel); ziel = null; } }
  wuerfel.position.copy(fokus).applyQuaternion(wuerfel.quaternion).negate();   // Blickpunkt bleibt in der Bildmitte
  camera.near = abstand * 0.02; camera.updateProjectionMatrix();
  camera.position.set(0, 0, abstand); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
});
window.TEST = { ansicht, modus, wuerfel, fokus, schiebe, zoome, abstand: () => abstand, bereit: () => !!inhalt };
</script>
</body>
</html>
