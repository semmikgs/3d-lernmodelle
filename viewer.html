<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>3D-Lernmodelle – AR-Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
  video { position: absolute; top: 0; left: 0; z-index: 0 !important; }
  canvas { position: absolute; top: 0; left: 0; z-index: 1 !important; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.55); color: #fff; font-size: 15px; }
  #ui select, #ui button { font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 0; }
  #ui button.on { background: #3b82f6; color: #fff; }
  #ui label { display: flex; align-items: center; gap: 6px; }
  #ui select#teil { max-width: 60vw; }
  #info { position: fixed; top: 10px; right: 10px; left: 10px; max-width: 560px; margin-left: auto; z-index: 10; display: none;
          background: rgba(255,255,255,.92); color: #111; padding: 10px 14px; border-radius: 10px; font-size: 16px; line-height: 1.4; }
  #info b { display: block; margin-bottom: 2px; }
  #info button { float: right; border: 0; background: none; font-size: 18px; margin: -4px -6px 0 6px; }
  body[data-ansicht="neutral"] { background: radial-gradient(circle at 50% 40%, #f4f5f7 0%, #c9ced6 70%, #9aa1ab 100%); }
  body[data-ansicht="thema"] { background: #87a9c9 center / cover no-repeat; }
  body[data-ansicht="neutral"] video, body[data-ansicht="thema"] video { opacity: 0 !important; }
  #start { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  #start button { font-size: 20px; padding: 14px 22px; border-radius: 12px; border: 0; background: #3b82f6; color: #fff; }
  #status { position: fixed; top: 10px; left: 10px; z-index: 10; color: #fff; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; font-size: 14px; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="status">Kamera wird gestartet …</div>
<div id="ui">
  <select id="modell"></select>
  <select id="teil" hidden></select>
  <label>Größe <input id="groesse" type="range" min="0.4" max="2.5" step="0.05" value="1"></label>
  <button id="abspielen" hidden>⏸ Pause</button>
  <input id="zeit" type="range" min="0" max="1" step="0.001" value="0" hidden>
  <button id="drehen">Drehen</button>
  <button id="dach" hidden>Dach</button>
  <button id="infoBtn" hidden>Info</button>
  <button id="ansicht">Ansicht: Kamera</button>
  <button id="wuerfel">Würfel</button>
</div>
<div id="start"><button id="startBtn">Tippen zum Starten</button></div>
<div id="info"><button id="infoZu" aria-label="Schließen">✕</button><b id="infoTitel"></b><span id="infoText"></span></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { ArToolkitSource, ArToolkitContext, ArMarkerControls } from './lib/ar-threex.mjs';
import { MODELLE } from './modelle/liste.js';
import { WuerfelTracker, Lagesensor } from './js/tracker.js';
import { Animation } from './js/animation.js';

// ---- Würfelgeometrie ----
// Marker (inkl. schwarzem Rand) = 1 Einheit. Würfelkante = Kante / Markergröße (7 cm / 5,6 cm).
const E = 1.25;
// Pro Seite: Barcode-ID, Achsen des Markers (X, Y = Normale, Z) im Würfelsystem – passend zur Faltvorlage.
const SEITEN = [
  { id: 1, name: 'oben',   x: [1,0,0],  y: [0,1,0],  z: [0,0,1]  },
  { id: 2, name: 'vorne',  x: [1,0,0],  y: [0,0,1],  z: [0,-1,0] },
  { id: 3, name: 'unten',  x: [1,0,0],  y: [0,-1,0], z: [0,0,-1] },
  { id: 4, name: 'links',  x: [0,0,1],  y: [-1,0,0], z: [0,-1,0] },
  { id: 5, name: 'rechts', x: [0,0,-1], y: [1,0,0],  z: [0,-1,0] },
  { id: 6, name: 'hinten', x: [-1,0,0], y: [0,0,-1], z: [0,-1,0] },
];

const status = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.Camera();
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const sonne = new THREE.DirectionalLight(0xffffff, 1.4); sonne.position.set(1, 2, 1); scene.add(sonne);

// Würfel-Anker: bekommt die geglättete Pose des Würfelmittelpunkts
const anker = new THREE.Group();
anker.matrixAutoUpdate = false;
anker.visible = false;
scene.add(anker);
const drehteller = new THREE.Group();
anker.add(drehteller);
const hilfsWuerfel = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(E, E, E)), new THREE.LineBasicMaterial({ color: 0x22d3ee }));
hilfsWuerfel.visible = false;
anker.add(hilfsWuerfel);

// ---- AR.js ----
const Q = new URLSearchParams(location.search);
const AUFL_BREITE = Q.get('aufl') === 'niedrig' ? 640 : 800;   // Breite des Auswertebilds (Höhe folgt dem Kamerabild)
const AUFL = [AUFL_BREITE, AUFL_BREITE * 3 / 4];
// Kameradaten passend zum tatsächlichen Kamerabild erzeugen (ARToolKit-Format, big-endian).
// Ohne das wird z. B. ein 16:9-Bild als 4:3 ausgewertet → verzerrte Tiefe → Modell wandert im Bogen.
function kameraDaten(w, h, hfovGrad) {
  const f = (w / 2) / Math.tan(hfovGrad * Math.PI / 360), cx = w / 2, cy = h / 2;
  const buf = new ArrayBuffer(176), dv = new DataView(buf);
  dv.setInt32(0, w); dv.setInt32(4, h);
  [f, 0, cx, 0, 0, f, cy, 0, 0, 0, 1, 0].forEach((v, i) => dv.setFloat64(8 + i * 8, v));
  [0, 0, 0, 0, f, f, cx, cy, 1].forEach((v, i) => dv.setFloat64(104 + i * 8, v));   // keine Verzeichnung
  return URL.createObjectURL(new Blob([buf], { type: 'application/octet-stream' }));
}
const HFOV = +(Q.get('fov') || 60);   // horizontaler Bildwinkel der Kamera (iPad-Rückkamera ≈ 60°)
const source = new ArToolkitSource({ sourceType: 'webcam', sourceWidth: 1280, sourceHeight: 960, displayWidth: innerWidth, displayHeight: innerHeight });
const context = new ArToolkitContext({
  cameraParametersUrl: 'data/camera_para.dat',
  detectionMode: 'mono_and_matrix', matrixCodeType: '3x3', patternRatio: 0.5,
  maxDetectionRate: 30, canvasWidth: AUFL[0], canvasHeight: AUFL[1],
});

function onResize() {
  source.onResizeElement();
  source.copyElementSizeTo(renderer.domElement);
  // Zeichenfläche in voller Bildschirmauflösung (sonst wird ein kleines Bild hochskaliert → unscharf)
  const w = parseFloat(renderer.domElement.style.width), h = parseFloat(renderer.domElement.style.height);
  if (w && h) renderer.setSize(w, h, false);
  if (context.arController) source.copyElementSizeTo(context.arController.canvas);
}
source.init(() => {
  let gestartet = false;
  source.domElement.addEventListener('canplay', () => {
    if (gestartet) return; gestartet = true;
    const v = source.domElement, vw = v.videoWidth || 4, vh = v.videoHeight || 3;
    context.parameters.canvasWidth = AUFL_BREITE;
    context.parameters.canvasHeight = Math.round(AUFL_BREITE * vh / vw);
    if (Q.get('kamera') !== 'alt') context.parameters.cameraParametersUrl = kameraDaten(context.parameters.canvasWidth, context.parameters.canvasHeight, HFOV);
    onResize();
    context.init(() => {
      camera.projectionMatrix.copy(context.getProjectionMatrix());
      // Nah-/Fernebene enger setzen → mehr Tiefengenauigkeit (gegen Flackern aufeinanderliegender Flächen)
      const NAH = 0.3, FERN = 200, m = camera.projectionMatrix.elements;
      m[10] = -(FERN + NAH) / (FERN - NAH); m[14] = -2 * FERN * NAH / (FERN - NAH);
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      camera.near = NAH; camera.far = FERN;   // für den logarithmischen Tiefenpuffer
      // Schwellwert passt sich an ungleichmäßiges Licht an (3 = adaptiv, 2 = Otsu)
      try { context.arController.setThresholdMode(Q.get('schwelle') === 'otsu' ? 2 : 3); } catch (e) {}
      status.textContent = 'Würfel vor die Kamera halten';
    });
  });
  setTimeout(onResize, 1500);
}, (err) => { status.textContent = 'Kamera-Fehler: ' + (err && err.message || err); });
addEventListener('resize', onResize);
document.addEventListener('click', () => { const v = source.domElement; if (v && v.paused) v.play().catch(() => {}); });

// ---- Lagesensor (iOS braucht einmal ein Antippen für die Erlaubnis) ----
const sensor = new Lagesensor();
const startBox = document.getElementById('start');
if (Q.get('gyro') !== '0') {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    startBox.style.display = 'flex';
    document.getElementById('startBtn').onclick = async () => {
      startBox.style.display = 'none';
      const v = source.domElement; if (v && v.paused) v.play().catch(() => {});
      await sensor.start();
    };
  } else sensor.start();
}

// Pro Würfelseite ein Marker-Root + Offset-Matrix (Marker -> Würfelmitte)
const marker = SEITEN.map(s => {
  const root = new THREE.Group();
  scene.add(root);
  new ArMarkerControls(context, root, { type: 'barcode', barcodeValue: s.id, changeMatrixMode: 'modelViewMatrix' });
  const T = new THREE.Matrix4().makeBasis(new THREE.Vector3(...s.x), new THREE.Vector3(...s.y), new THREE.Vector3(...s.z));
  T.setPosition(new THREE.Vector3(...s.y).multiplyScalar(E / 2));
  return { ...s, root, inv: T.clone().invert() };
});
const tracker = new WuerfelTracker(marker, sensor);

// ---- Modell laden ----
const loader = new GLTFLoader();
const sel = document.getElementById('modell');
const selTeil = document.getElementById('teil');
const btnDach = document.getElementById('dach');
const btnInfo = document.getElementById('infoBtn');
const infoBox = document.getElementById('info');
for (const [k, v] of Object.entries(MODELLE)) sel.add(new Option(v.name, k));
const url = new URLSearchParams(location.search);
if (url.get('m') && MODELLE[url.get('m')]) sel.value = url.get('m');

const anim = new Animation(document.getElementById('abspielen'), document.getElementById('zeit'));
const hülle = new THREE.Group();   // skaliert auf Würfelgröße
drehteller.add(hülle);
let inhalt = null, cfg = null, knoten = {}, boxen = {}, gesamtBox = null, dachAn = false, ladeNr = 0;

function merkeUrl() {
  history.replaceState(null, '', '?m=' + sel.value + (selTeil.value ? '&r=' + selTeil.value : ''));
}
sel.onchange = () => { selTeil.value = ''; lade(sel.value, ''); merkeUrl(); };
selTeil.onchange = () => { zeige(selTeil.value); merkeUrl(); };

// Abnehmbares Teil (Dach, Vorderseite …) – aus der Modellliste, Standard: Dach
const abd = () => (cfg && cfg.abdeckung && cfg.abdeckung.id) || 'dach';
function lade(name, teil) {
  const nr = ++ladeNr;
  cfg = MODELLE[name];
  btnDach.textContent = (cfg.abdeckung && cfg.abdeckung.name) || 'Dach';
  // Untermenü aufbauen
  selTeil.innerHTML = '';
  selTeil.hidden = !cfg.teile;
  if (cfg.teile) {
    if (cfg.ganz !== false) selTeil.add(new Option(cfg.ganz || 'Ganzes Modell', ''));
    for (const t of cfg.teile) selTeil.add(new Option(t.name, t.id));
  }
  loader.load('modelle/' + name + '.glb', (gltf) => {
    if (nr !== ladeNr) return;
    if (inhalt) hülle.remove(inhalt);
    inhalt = gltf.scene;
    inhalt.updateMatrixWorld(true);
    gesamtBox = new THREE.Box3().setFromObject(inhalt);
    knoten = {}; boxen = {};
    for (const id of [...(cfg.teile || []).flatMap(t => [t.id, t.detail]).filter(Boolean), abd(), 'umgebung']) {
      const k = inhalt.getObjectByName(id);
      if (k) { knoten[id] = k; boxen[id] = new THREE.Box3().setFromObject(k); }
    }
    dachAn = false;
    hülle.add(inhalt);
    anim.setze(inhalt, gltf.animations);
    setzeAnsicht(ansicht);
    // ohne „Ganzes Modell“: ersten (oder vorgegebenen) Teil zeigen
    const erster = cfg.ganz === false && cfg.teile ? (cfg.start || cfg.teile[0].id) : '';
    selTeil.value = (teil && boxen[teil]) ? teil : erster;
    zeige(selTeil.value);
  }, undefined, () => { status.textContent = 'Modell nicht gefunden: ' + name; status.style.display = ''; });
}

function einpassen(box, faktor) {
  const size = box.getSize(new THREE.Vector3()).length();
  inhalt.position.copy(box.getCenter(new THREE.Vector3())).negate();
  hülle.scale.setScalar((E * faktor) / size);
}

function zeige(teil) {
  if (!inhalt) return;
  const t = cfg.teile && cfg.teile.find(x => x.id === teil);
  if (t && (knoten[teil] || (t.detail && knoten[t.detail]))) {
    // nur diesen Raum zeigen, groß
    const ziel = (t.detail && knoten[t.detail]) ? t.detail : teil;
    for (const [id, k] of Object.entries(knoten)) k.visible = (id === ziel);
    einpassen(boxen[ziel], 1.5);
    zeigeInfo(t.name, t.info);
  } else {
    const details = new Set((cfg.teile || []).map(x => x.detail).filter(Boolean));
    for (const [id, k] of Object.entries(knoten)) k.visible = (id === abd()) ? dachAn : !details.has(id);
    einpassen(gesamtBox, 1.3);
    zeigeInfo(cfg.name, cfg.info);
  }
  btnDach.hidden = !knoten[abd()] || !!t;
  btnDach.classList.toggle('on', dachAn);
  anim.starte(t ? t.animation : cfg.animation);
}

let infoAn = true;
function zeigeInfo(titel, text) {
  document.getElementById('infoTitel').textContent = titel;
  document.getElementById('infoText').textContent = text || '';
  btnInfo.hidden = !text;
  infoBox.style.display = (text && infoAn) ? 'block' : 'none';
  btnInfo.classList.toggle('on', !!text && infoAn);
}
document.getElementById('infoZu').onclick = () => { infoAn = false; infoBox.style.display = 'none'; btnInfo.classList.remove('on'); };
btnInfo.onclick = () => { infoAn = !infoAn; infoBox.style.display = infoAn ? 'block' : 'none'; btnInfo.classList.toggle('on', infoAn); };
btnDach.onclick = () => { dachAn = !dachAn; if (knoten[abd()]) knoten[abd()].visible = dachAn; btnDach.classList.toggle('on', dachAn); };

lade(sel.value, url.get('r'));

// ---- Ansicht: Kamera / Neutral / Thema ----
const ANSICHTEN = ['kamera', 'neutral', 'thema'];
const ANSICHT_TEXT = { kamera: 'Kamera', neutral: 'Neutral', thema: 'Themenbild' };
let ansicht = ANSICHTEN.includes(Q.get('ansicht')) ? Q.get('ansicht') : 'kamera';
const btnAnsicht = document.getElementById('ansicht');
function setzeAnsicht(a) {
  ansicht = a;
  document.body.dataset.ansicht = a;
  document.body.style.backgroundImage = a === 'thema' ? `url(hintergruende/${(cfg && cfg.hintergrund) || 'blaupause'}.svg)` : '';
  btnAnsicht.textContent = 'Ansicht: ' + ANSICHT_TEXT[a];
  btnAnsicht.classList.toggle('on', a !== 'kamera');
}
btnAnsicht.onclick = () => setzeAnsicht(ANSICHTEN[(ANSICHTEN.indexOf(ansicht) + 1) % 3]);
setzeAnsicht(ansicht);

// ---- Bedienung ----
const groesse = document.getElementById('groesse');
groesse.oninput = () => drehteller.scale.setScalar(+groesse.value);
let drehen = false;
const btnDrehen = document.getElementById('drehen');
btnDrehen.onclick = () => { drehen = !drehen; btnDrehen.classList.toggle('on', drehen); };
const btnWuerfel = document.getElementById('wuerfel');
btnWuerfel.onclick = () => { hilfsWuerfel.visible = !hilfsWuerfel.visible; btnWuerfel.classList.toggle('on', hilfsWuerfel.visible); };

// ---- Schleife ----
let letzte = performance.now();
renderer.setAnimationLoop(() => {
  const jetzt = performance.now(), dt = Math.min((jetzt - letzte) / 1000, 0.1); letzte = jetzt;
  let neu = false;
  if (source.ready && context.arController) neu = context.update(source.domElement) !== false;
  tracker.update(dt, neu);
  anker.visible = tracker.sichtbar(ansicht !== 'kamera');
  if (anker.visible) {
    anker.matrix.compose(tracker.pos, tracker.rot, EINS);
    status.style.display = 'none';
  }
  if (drehen) drehteller.rotation.y += dt * 0.6;
  anim.update(dt);
  renderer.render(scene, camera);
  if (Q.get('debug')) window.DEBUG = { sichtbar: anker.visible, seiten: tracker.anzahlSeiten, pos: tracker.pos.toArray(), rot: tracker.rot.toArray(), verloren: tracker.verloren, diag: tracker.diag, kalib: tracker.variante ? (tracker.variante.inv ? 'inv' : 'dir') + tracker.varianten.indexOf(tracker.variante) % 4 : null, proben: tracker.kalibProben, streuung: tracker.streuung, k: +tracker.skala.toFixed(3), video: [source.domElement.videoWidth, source.domElement.videoHeight] };
});
const EINS = new THREE.Vector3(1, 1, 1);
</script>
</body>
</html>
